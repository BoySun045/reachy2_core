# Pathplanner configuration
# Paths are relative to this config file's directory.

# Data directory containing point clouds, poses, objects, etc.
data_dir: "/home/marwan/marwan_ws/reachy2_core/reachy_nav/data_dso/2026_02_24-13_10_34-sfm_map_dso"

# Point cloud files (relative to data_dir)
pcd_file: "tsdf_fused.ply"
# reachability_file: "reachability_reachy_2.ply"
reachability_file: "reachability_spot.ply"
objects_file: "object_scene_graph/frame_final_objects.pkl.gz"

# Coordinate frame: set to true if TSDF was generated with --z-up.
# When true, object bboxes are converted from Y-up to Z-up to match.
z_up: false

# Planning mode:
#   "collision"    - uses pcd as obstacles, collision-checks with robot polygon stack
#   "reachability" - uses reachability cloud as valid space, no collision check needed
planning_mode: "reachability"

# Override nav goals for specific objects (skips reachability lookup).
# Keys are matched case-insensitively as substrings of object names.
# target_overrides:
#   "light switch":
#     # position: [0.5598, -0.1304, 0.003]
#     # orientation: [0.0, 0.0, 0.35464, 0.93500]  # [x, y, z, w] — yaw ~41.5°
#     position: [0.5472, -0.121, -1.03]
#     orientation: [0.0011068275524246387, -0.00193383386992288, -0.3376229732154958, -0.941278791419663]  # [x, y, z, w]
#   "lamp":
#     position: [0.32322, -2.07188, -1.02061]
#     orientation: [0.00035, 0.00024, 0.89510, -0.44587]  # [x, y, z, w]

target_overrides:
  "light switch_2":
    # position: [0.5598, -0.1304, 0.003]
    # orientation: [0.0, 0.0, 0.35464, 0.93500]  # [x, y, z, w] — yaw ~41.5°
    position: [0.5472, -0.121, -1.03]
    orientation: [0.0011068275524246387, -0.00193383386992288, -0.3376229732154958, -0.941278791419663]  # [x, y, z, w]
  "lamp_2":
    position: [0.32322, -2.07188, -1.02061]
    orientation: [0.00035, 0.00024, 0.89510, -0.44587]  # [x, y, z, w]